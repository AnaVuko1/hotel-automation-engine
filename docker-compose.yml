version: '3.8'

services:
  hae:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/hotel.db
      - SECRET_KEY=${SECRET_KEY:-hae-development-secret-key-change-in-production}
      - HOTEL_NAME=${HOTEL_NAME:-Grand Horizon Hotel}
    volumes:
      - ./data:/app/data
    command: >
      sh -c "python scripts/seed_demo.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  hae-redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles: ["full"]
    restart: unless-stopped
